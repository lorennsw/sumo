<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sumo de Bolas Online</title>
<style>body{margin:0;background:#2b1055;color:#fff;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block}
#top{position:fixed;top:8px;width:100%;text-align:center;font-size:14px;pointer-events:none;padding:0 8px;box-sizing:border-box}.m{display:none}@media (pointer:coarse),(max-width:600px){.d{display:none}.m{display:inline}#top{font-size:12px}}</style></head><body>
<div id="top">🥋 <b>SUMO DE BOLAS ONLINE</b> <span class="d">— WASD/flechas o arrastrá el dedo. Pasales el link a tus amigos.</span><span class="m"><br>Arrastrá el dedo para moverte</span></div>
<canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
const name=(prompt('Tu nombre:')||'Jugador').slice(0,12);let S=null,me=0,k={},touch=null;
const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>ws.send(JSON.stringify({name}));
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.you)me=d.you;else if(d.full)alert('Sala llena (máx 6)');else{const old=S;S=d;{const m=S.ps.find(p=>p.id==me);if(!m||!m.alive||S.state=='wait')pr=null;else if(!pr||Math.hypot(m.x-pr.x,m.y-pr.y)>90)pr={x:m.x,y:m.y,vx:m.vx,vy:m.vy};else{pr.x+=(m.x-pr.x)*.15;pr.y+=(m.y-pr.y)*.15;pr.vx+=(m.vx-pr.vx)*.25;pr.vy+=(m.vy-pr.vy)*.25}}if(old&&navigator.vibrate){const a=old.ps.find(p=>p.id==me),b=S.ps.find(p=>p.id==me);if(a&&b&&a.alive&&!b.alive)navigator.vibrate(300);if(old.state=='play'&&S.state=='over'&&b&&b.alive)navigator.vibrate([80,60,80,60,200])}if(old)for(const p of S.ps){const o=old.ps.find(q=>q.id==p.id);if(o&&o.alive){p.rx=o.rx;p.ry=o.ry}}}};
onkeydown=e=>{k[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>k[e.key.toLowerCase()]=0;
c.onpointerdown=e=>{touch={sx:e.clientX,sy:e.clientY,x:0,y:0,cx:e.clientX,cy:e.clientY};const d=document.documentElement;if(e.pointerType=='touch'&&!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})};
c.onpointermove=e=>{if(touch){let dx=e.clientX-touch.sx,dy=e.clientY-touch.sy;const l=Math.hypot(dx,dy);if(l>60){dx*=60/l;dy*=60/l}touch.cx=touch.sx+dx;touch.cy=touch.sy+dy;touch.x=dx/50;touch.y=dy/50}};
c.onpointerup=c.onpointercancel=()=>touch=null;
let last='',cur={x:0,y:0},pr=null,acc=0,lt=0;setInterval(()=>{if(ws.readyState!=1)return;let ix=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),iy=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
 if(touch){ix=touch.x;iy=touch.y}ix=Math.max(-1,Math.min(1,ix));iy=Math.max(-1,Math.min(1,iy));cur={x:ix,y:iy};const m=JSON.stringify({in:{x:ix,y:iy}});if(m!=last){ws.send(m);last=m}},16);
const petals=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),s:2+Math.random()*4,v:.0005+Math.random()*.001,w:Math.random()*6}));
function scene(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1055');g.addColorStop(.6,'#7a2e4a');g.addColorStop(1,'#d9775a');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#ffe8c2';x.globalAlpha=.85;x.beginPath();x.arc(W*.82,H*.2,Math.min(W,H)*.09,0,7);x.fill();x.globalAlpha=1;
 x.fillStyle='#2a0f1f';x.beginPath();x.moveTo(0,H);x.lineTo(W*.15,H*.62);x.lineTo(W*.3,H*.75);x.lineTo(W*.5,H*.55);x.lineTo(W*.7,H*.72);x.lineTo(W*.88,H*.6);x.lineTo(W,H*.7);x.lineTo(W,H);x.fill();
 for(let i=0;i<6;i++){const lx=W*(i+.5)/6,ly=40+Math.sin(t/700+i)*4;x.strokeStyle='#000';x.beginPath();x.moveTo(lx,0);x.lineTo(lx,ly-14);x.stroke();
  x.fillStyle='#ff5a3c';x.shadowColor='#ffb347';x.shadowBlur=25;x.beginPath();x.ellipse(lx,ly,11,15,0,0,7);x.fill();x.shadowBlur=0}
 x.fillStyle='#ffc0d9';for(const p of petals){p.y+=p.v;p.x+=Math.sin(t/900+p.w)*.0006;if(p.y>1){p.y=-.02;p.x=Math.random()}
  x.beginPath();x.ellipse(p.x*W,p.y*H,p.s,p.s/2,t/500+p.w,0,7);x.fill()}}
function ring(R){ x.beginPath();x.arc(0,0,R+10,0,7);x.lineWidth=14;x.strokeStyle='#e6d3a3';x.stroke();
 const g=x.createRadialGradient(0,0,10,0,0,R);g.addColorStop(0,'#f3dfb0');g.addColorStop(1,'#d8b878');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();
 x.fillStyle='#fff';x.fillRect(-30,-14,8,28);x.fillRect(22,-14,8,28);
 x.font='bold '+R*.5+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(120,40,20,.15)';x.fillText('相撲',0,0);x.textBaseline='alphabetic'}
(function loop(t){t=t||0;scene(t);acc+=Math.min(100,t-lt);lt=t;while(acc>=16.67){acc-=16.67;if(pr){pr.vx=(pr.vx+cur.x*.6)*.92;pr.vy=(pr.vy+cur.y*.6)*.92;pr.x+=pr.vx;pr.y+=pr.vy}}
 if(S){const sc=Math.min(W,H)/700;x.save();x.translate(W/2,H/2);x.scale(sc,sc);
  ring(S.R);
  for(const p of S.ps){if(!p.alive)continue;if(p.id==me&&pr){p.rx=pr.x;p.ry=pr.y}else{p.rx=p.rx==null?p.x:p.rx+(p.x-p.rx)*.3;p.ry=p.ry==null?p.y:p.ry+(p.y-p.ry)*.3}const X=p.rx,Y=p.ry;x.beginPath();x.arc(X,Y,22,0,7);x.fillStyle=p.col;x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=12;x.shadowOffsetY=6;x.fill();x.shadowBlur=0;x.shadowOffsetY=0;x.fillStyle='#fff';x.fillRect(X-22,Y+6,44,7);
   if(p.id==me){x.lineWidth=4;x.strokeStyle='#fff';x.stroke()}
   x.fillStyle='#000';x.beginPath();x.arc(X-7,Y-5,4,0,7);x.arc(X+7,Y-5,4,0,7);x.fill();
   x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(p.name,X,Y-30)}
  x.restore();x.textAlign='left';x.font='bold '+(W<600?13:16)+'px system-ui';
  S.ps.forEach((p,i)=>{x.fillStyle=p.col;x.fillText('● '+p.name+': '+p.score+(p.id==me?' (vos)':''),12,(W<600?62:50)+i*20)});
  if(S.state!='play'){x.fillStyle='#fff';x.textAlign='center';x.font='bold '+Math.min(30,W/16|0)+'px system-ui';x.shadowColor='#000';x.shadowBlur=8;x.fillText(S.msg,W/2,H/2);x.shadowBlur=0}}
 else{x.fillStyle='#fff';x.textAlign='center';x.font='20px system-ui';x.fillText('Conectando...',W/2,H/2)}
 if(touch){x.globalAlpha=.35;x.fillStyle='#fff';x.beginPath();x.arc(touch.sx,touch.sy,60,0,7);x.fill();x.globalAlpha=.8;x.beginPath();x.arc(touch.cx,touch.cy,26,0,7);x.fill();x.globalAlpha=1}
 requestAnimationFrame(loop)})();
</script></body></html>
